<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airline Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <p class="eyebrow">Weekly timetable</p>
        <h1>Flight schedules</h1>
        <p class="lede">
          Enter origin and destination IATA codes. Run loads a cached route when one exists;
          Update always refreshes from FlightsFrom.com.
        </p>
      </header>

      <form id="schedule-form" class="search-card" autocomplete="off">
        <div class="fields">
          <label>
            From
            <input
              id="origin"
              name="origin"
              maxlength="3"
              minlength="3"
              placeholder="MAD"
              required
              spellcheck="false"
            />
          </label>
          <span class="route-arrow" aria-hidden="true">→</span>
          <label>
            To
            <input
              id="destination"
              name="destination"
              maxlength="3"
              minlength="3"
              placeholder="AMS"
              required
              spellcheck="false"
            />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="run-button">Run</button>
          <button type="button" id="update-button" class="secondary">Update</button>
        </div>
      </form>

      <p id="status" class="status" hidden></p>
      <p id="error" class="error" hidden></p>

      <section id="results" class="results" hidden>
        <div class="results-meta">
          <h2 id="route-title"></h2>
          <p id="results-caption"></p>
        </div>
        <div class="table-wrap">
          <table id="schedule-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/js/app.js"></script>
  </body>
</html>
